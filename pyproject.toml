[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knot"
version = "0.3.0"
description = "KNOT — natural-language SQL/chart assistant (KNOT)"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies = { dev = { file = ["requirements-dev.txt"] } }

[tool.setuptools.packages.find]
include = ["knot*"]
exclude = ["tests*", "frontend*"]

# ── Ruff ──
[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["knot/static", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PL"]
ignore = [
    "E501",      # line too long
    "B008",      # FastAPI Depends() in default
    "B904",      # 历史代码无 raise from err，legacy 不强制
    # ── pylint 度量类（在 v0.3.x 重构期不强制；后续 PATCH 可单独清理）
    "PLR0913",   # too many args
    "PLR0917",   # too many **positional** args —— 与已豁免的 PLR0913 同度量类；ruff 0.16.0 将其从 preview
                 # 转正式 → 20 个既存文件（repo/service 层惯用长签名）一夜变红，与本 PATCH 无关（v0.9.2
                 # `8680b16` 在 ruff 0.15.x 下同一 job 全绿）。按既有「度量类不强制」口径豁免，不在硬化
                 # PATCH 里夹带 20 文件 keyword-only 重构。清理 = 独立 lint PATCH（backlog）。
    "PLR0911",   # too many returns
    "PLR0912",   # too many branches
    "PLR0915",   # too many statements
    "PLR2004",   # magic numbers
    "PLW0603",   # global statement（catalog reload 等场景合法使用）
    "PLW2901",   # for-loop var overwrite（常见 .strip() 模式）
    "PLC0415",   # import outside top-level（v0.3.x 大量 deferred imports 是工程化设计）
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "F401"]
"knot/core/_*_shim.py" = ["F401", "F403"]
"knot/core/persistence.py" = ["F401", "F403"]

# ── pytest ──
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
# v0.6.2.0 R-PB-B1-10：race 标记测试在 CI 可单独 job 跑（γ2 折中 + NRP-2 隔离）
markers = [
    "race: TOTP race condition tests (rate limit 100× 守护)",
]
