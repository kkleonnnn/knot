name: CI

on:
  push:
    branches: [main, "feat/**", "hotfix/**"]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ⚠️ editable 安装必须在所有静态/动态分析步骤之前完成 ——
      # import-linter / pytest / boot-smoke 都依赖 site-packages 中已注册的 knot
      - name: Install (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -c "import knot; print('knot installed at', knot.__file__)"

      # ⚙️ ruff **CI-only pin**（资深架构师 2026-07-26 拍板「只在 CI pin、dev 浮动」）
      # 为什么：ruff 把规则从 preview 转正式是随 **minor** 发布的 —— 一次上游 minor 就能让既存代码一夜变红，
      # 且与本次改动无关。实证（v0.9.2 PR#254）：0.16.0 转正 PLR0917 → `knot/` 35 条报错散在 20 个既存文件，
      # 同一 job 在前一 commit（0.15.x）全绿。此处钉 **minor 上界、放开 patch**（拿 bug fix，不拿新规则）。
      # 故意不对称：`requirements-dev.txt` 仍是 `ruff>=0.6.0` 浮动 → 本地先撞到新规则（早发现），
      # CI 不因上游发版而红（不阻塞合并）。升 minor = 有意动作：改此处上界 + 单独 lint PATCH 清理新规则。
      - name: Pin ruff (CI 闸门确定性；dev 侧仍浮动)
        run: pip install "ruff>=0.16,<0.17"

      - name: Ruff lint
        run: ruff check knot/

      # v0.5.2 D7 加码：R-94 行数核验（13 文件硬上限不可超）
      - name: File-sizes (R-94)
        run: python3 scripts/check_file_sizes.py

      # 依赖 Install 步骤完成；7 contracts 不绕过即合入
      - name: Import-linter (7 contracts KEPT)
        run: lint-imports

      - name: Pytest
        env:
          KNOT_MASTER_KEY: ${{ secrets.TEST_MASTER_KEY }}
          # v0.6.0.8 MUST-1：JWT_SECRET fail-fast 后 pytest 需要 import 时已设
          # conftest.py os.environ.setdefault 也兜底，但 env 显式更早
          JWT_SECRET: "ci-test-jwt-secret-32-chars-min-length-padding"
        run: |
          # CI 注入测试 key（v0.4.5 R-37：测试 master key 与生产隔离）
          # 若 secrets.TEST_MASTER_KEY 未配置，conftest autouse fixture 会兜底设置
          if [ -z "$KNOT_MASTER_KEY" ]; then
            export KNOT_MASTER_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          fi
          pytest tests/ -v --tb=short --ignore=tests/eval

  # v0.6.0.14 前端 lint 闸门 — 0 errors / 0 warnings；任何回退即红
  # 内测评估反馈："构建能过不代表质量闸门健康"——把 npm run lint 钉死在 CI 上
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend lint (eslint — 0 errors / 0 warnings)
        working-directory: frontend
        run: npm run lint -- --max-warnings=0
      - name: Frontend test (vitest — 纯逻辑回归网 · v0.7.43 B5.1)
        working-directory: frontend
        run: npm run test

  # v0.6.0.9 F3 CI 精简：boot smoke 矩阵 4→1 variants
  # 历史背景：
  #   v0.5.0 R-72/R-77 时期 bi-agent → knot 重命名，需要验证 env 4 组合
  #     (only-knot / only-biagent / both-same / neither)
  #   v0.6.0 撤回 R-67/68/74 双源后，only-biagent / both-same / neither 矩阵语义反转为
  #     "升级路径守护"——守护对象自 v0.6.0 已 13 MINOR 0 命中
  # 决议：
  #   - 保留 only-knot（happy path 启动验证；含 title/version/routes 守护）
  #   - 删除 only-biagent / both-same / neither（守护对象失效；同 R-67/68/74 撤回精神）
  #   - 配额从 6 job × ~10min queue 降至 3 job × ~4min（节省 60%）
  # 守护回退：旧 env 名 fail-fast 行为由 tests/scripts/test_env_*.py 单元覆盖（如有需求）
  boot-smoke:
    name: boot smoke (only-knot, ubuntu-latest)
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Boot smoke
        run: |
          export KNOT_MASTER_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          export JWT_SECRET="boot-smoke-jwt-32-chars-min-length-pad"
          # title=KNOT / version 动态读 main.py（v0.5.8 R-187 治本模式）
          # routes 改为 >= 下限（v0.6.0.3 守护者 P-2 救火 — 防路由蒸发）
          # v0.6.2.5 commit 7: 动态展平 FastAPI 0.137+ _IncludedRouter 懒包装（与 tests/_route_count 同逻辑）
          python -c "
          import re
          src = open('knot/main.py').read()
          expected = re.search(r'version=\"([\d.]+)\"', src).group(1)
          from knot.main import app
          def _flat(routes):
              out = []
              for r in routes:
                  o = getattr(r, 'original_router', None)
                  if o is not None and hasattr(o, 'routes'): out.extend(_flat(o.routes))
                  else: out.append(r)
              return out
          routes = _flat(app.routes)
          assert app.title == 'KNOT', f'title={app.title}'
          assert app.version == expected, f'version={app.version} expected={expected}'
          assert len(routes) >= 80, f'routes={len(routes)} (下限 80 防路由蒸发)'
          print(f'boot smoke OK: title=KNOT version={app.version} routes={len(routes)}')
          "

  # v0.6.0.1 G-5 守护者立约：docker build CI 自动闸门
  # R-PA-15 非阻塞性 — continue-on-error（避免 docker hub rate limit 等环境噪声误杀 PR）
  # 但 R-PA-11 三守护（prompts/_template_catalog.py/frontend-builder /knot/static）必过
  # 闸门 13.A 本地 simulate catch 过 Dockerfile bug 但人手动跑不可持续 — CI 自动化是唯一可持续守护
  docker-build:
    name: docker build smoke
    needs: lint-test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: |
          docker build -t knot-ci-smoke . 2>&1 | tee build.log
          if grep -q "ERROR\|error: failed" build.log; then
            echo "::error::docker build 失败 — R-PA-11 守护对象"
            exit 1
          fi
          echo "docker build OK"
      - name: R-PA-7 三守护文件验证（docker exec）
        run: |
          docker run --rm --entrypoint sh knot-ci-smoke -c "ls /app/knot/prompts/" | tee /tmp/prompts.txt
          grep -q "sql_planner.md" /tmp/prompts.txt || (echo "::error::R-PA-7.1 prompts COPY 守护失败"; exit 1)
          docker run --rm --entrypoint sh knot-ci-smoke -c "ls /app/knot/services/agents/_template_catalog.py" \
            || (echo "::error::R-PA-7.2 _template_catalog.py COPY 守护失败"; exit 1)
          docker run --rm --entrypoint sh knot-ci-smoke -c "ls /app/knot/static/index.html" \
            || (echo "::error::R-PA-7.3 frontend static COPY 守护失败"; exit 1)
          echo "R-PA-7.1/7.2/7.3 三守护 PASS"

  # ⭐ v0.9.13 P0 —— 构建上下文泄漏守护（**阻断**）
  #
  # 为什么是**独立且阻断**的 job（守护者 Stage 3 Q2 裁 (c)）：
  #   · 上面那个 docker-build 是 `continue-on-error: true`（R-PA-15，为避 Docker Hub
  #     rate limit 误杀 PR）⇒ 把 P0 的守护挂在它上面 = **守护本身非阻断**（Codex R7 点名）。
  #   · 而本 job 用 `FROM scratch` + BuildKit **tar exporter** ⇒ **零 Docker Hub 拉取**
  #     （scratch 是保留的空镜像，不需要任何 registry）⇒ 可以阻断，且不把 rate-limit 噪声请回来。
  #   · 不需要跑容器（scratch 没 shell），也不需要 —— **被测的是构建上下文，不是运行时**。
  #
  # 它跑的就是 `tests/scripts/test_dockerignore_context.py`（含 8 族 canary 的 per-family mutant）。
  dockerignore-context:
    name: build context leak guard
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: docker/setup-buildx-action@v3
      # ⚠️ 只装 pytest 是**刻意**的：若装全套业务依赖，一次上游发版就能让 **P0 的守护**变红
      #    （与它的目的相反）。前提是那个测文件**零 import 业务模块**、只用内建 fixture。
      - name: install pytest only
        run: pip install "pytest>=8.0.0"
      # ⚠️ `--noconftest` 不可省 —— pytest **总会**先加载根 `tests/conftest.py`，而它 import fastapi。
      #    **首次上 CI 就是这样红的**（本地跑不出来：本地 venv 里 fastapi 装着）。
      - name: build-context leak guard（真 Docker oracle · 零 registry 拉取）
        run: |
          python -m pytest tests/scripts/test_dockerignore_context.py \
            -v --no-header -p no:cacheprovider --noconftest
